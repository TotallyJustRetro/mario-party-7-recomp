name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone gcn-recomp
        run: git clone https://github.com/ethannicholas/gcn-recomp.git gcn-recomp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ninja
        run: choco install ninja -y

      - name: Download dtk
        shell: bash
        run: |
          curl -sL -o gcn-recomp/tools/dtk.exe \
            https://github.com/encounter/decomp-toolkit/releases/latest/download/dtk-windows-x86_64.exe

      - name: Download game disc
        shell: bash
        env:
          GAME_URL: ${{ secrets.GAME_ISO_URL }}
        run: |
          if [ -n "$GAME_URL" ]; then
            echo "Downloading disc..."
            curl -L -o game_input.rvz "$GAME_URL"
            echo "Converting RVZ to ISO..."
            gcn-recomp/tools/dtk.exe disc convert game_input.rvz game.iso
            echo "HAVE_DISC=true" >> $GITHUB_ENV
          else
            echo "No GAME_ISO_URL secret - building runtime_check only"
            echo "HAVE_DISC=false" >> $GITHUB_ENV
          fi

      - name: Configure
        shell: bash
        run: |
          if [ "$HAVE_DISC" == "true" ]; then
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DGCN_OPENXR=OFF \
              -DGAME_ISO=game.iso
          else
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DGCN_OPENXR=OFF
          fi

      - name: Build
        shell: bash
        run: |
          if [ "$HAVE_DISC" == "true" ]; then
            cmake --build build --target mp7 -j4
          else
            cmake --build build --target runtime_check -j4
          fi

      - name: Collect runtime DLLs
        if: env.HAVE_DISC == 'true'
        shell: bash
        run: |
          mkdir -p dist
          cp build/mp7.exe dist/
          # Copy MinGW runtime DLLs needed to run on machines without MinGW
          for dll in libwinpthread-1.dll libgcc_s_seh-1.dll libstdc++-6.dll; do
            path=$(where $dll 2>/dev/null || find /c/mingw64 /c/mingw /c/msys64 -name "$dll" 2>/dev/null | head -1)
            if [ -f "$path" ]; then
              cp "$path" dist/
              echo "Copied $dll"
            else
              echo "WARNING: $dll not found"
            fi
          done
          # Copy SDL2 if present
          find build -name "SDL2.dll" -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist/

      - name: Upload binary
        if: env.HAVE_DISC == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mp7-windows
          path: dist/
          if-no-files-found: warn
