name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone gcn-recomp
        run: git clone https://github.com/ethannicholas/gcn-recomp.git gcn-recomp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ninja
        run: choco install ninja -y

      - name: Download dtk
        shell: bash
        run: |
          curl -sL -o gcn-recomp/tools/dtk.exe \
            https://github.com/encounter/decomp-toolkit/releases/latest/download/dtk-windows-x86_64.exe

      - name: Download game disc
        shell: bash
        env:
          GAME_URL: ${{ secrets.GAME_ISO_URL }}
        run: |
          if [ -n "$GAME_URL" ]; then
            echo "Downloading disc..."
            curl -L -o game_input.rvz "$GAME_URL"
            echo "Converting RVZ to ISO..."
            gcn-recomp/tools/dtk.exe disc convert game_input.rvz game.iso
            echo "HAVE_DISC=true" >> $GITHUB_ENV
          else
            echo "No GAME_ISO_URL secret - building runtime_check only"
            echo "HAVE_DISC=false" >> $GITHUB_ENV
          fi

      - name: Configure
        shell: bash
        run: |
          if [ "$HAVE_DISC" == "true" ]; then
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DGCN_OPENXR=OFF \
              -DGCN_TRACE_CALLS=ON \
              -DGAME_ISO=game.iso
          else
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DGCN_OPENXR=OFF \
              -DGCN_TRACE_CALLS=ON
          fi

      - name: Build
        shell: bash
        run: |
          if [ "$HAVE_DISC" == "true" ]; then
            cmake --build build --target CruiseNavigator -j4
          else
            cmake --build build --target runtime_check -j4
          fi

      - name: Collect release files
        if: env.HAVE_DISC == 'true'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\CruiseNavigator.exe dist\

          # MinGW runtime DLLs
          $dlls = @("libwinpthread-1.dll","libgcc_s_seh-1.dll","libstdc++-6.dll")
          $paths = @("C:\mingw64\bin","C:\msys64\mingw64\bin","C:\msys64\usr\bin",
                     "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin")
          foreach ($dll in $dlls) {
            foreach ($p in $paths) {
              $f = Join-Path $p $dll
              if (Test-Path $f) { Copy-Item $f dist\; Write-Host "Copied $dll"; break }
            }
          }

          # SDL2
          $sdl = Get-ChildItem -Path build -Filter SDL2.dll -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sdl) { Copy-Item $sdl.FullName dist\ }

          Write-Host "--- dist ---"
          Get-ChildItem dist

      - name: Upload release
        if: env.HAVE_DISC == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CruiseNavigator-windows
          path: dist/
          if-no-files-found: warn
