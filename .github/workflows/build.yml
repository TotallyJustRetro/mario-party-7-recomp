name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone gcn-recomp
        run: git clone https://github.com/ethannicholas/gcn-recomp.git gcn-recomp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ninja
        run: choco install ninja -y

      - name: Download dtk
        shell: bash
        run: |
          curl -sL -o gcn-recomp/tools/dtk.exe \
            https://github.com/encounter/decomp-toolkit/releases/latest/download/dtk-windows-x86_64.exe

      - name: Download game disc
        shell: bash
        env:
          GAME_URL: ${{ secrets.GAME_ISO_URL }}
        run: |
          if [ -n "$GAME_URL" ]; then
            curl -L -o game.iso "$GAME_URL"
            echo "HAVE_DISC=true" >> $GITHUB_ENV
          else
            echo "No GAME_ISO_URL secret - building runtime_check only"
            echo "HAVE_DISC=false" >> $GITHUB_ENV
          fi

      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if "%HAVE_DISC%"=="true" (
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGAME_ISO=game.iso
          ) else (
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          )

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if "%HAVE_DISC%"=="true" (
            cmake --build build --target mp7
          ) else (
            cmake --build build --target runtime_check
          )

      - name: Upload binary
        if: env.HAVE_DISC == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mp7-windows
          path: build/mp7.exe
          if-no-files-found: ignore
